{% load blog_tags %}
<div class="col-lg-12">
    <div class="sidebar-item categories">
      <div class="sidebar-heading">
        <h2>Categories</h2>
      </div>
      <div class="content">
        {% for object in cats %}
        <ul>
          <li><a href="{% url 'blog:category' cat=object %}">- {{object.name}}</a></li>
        </ul>
        {% endfor %}
      </div>
    </div>
  </div>
