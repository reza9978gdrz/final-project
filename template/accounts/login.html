{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<title>Login Pag</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
<!--===============================================================================================-->	
	<link rel="icon" type="image/png" href="{% static 'images/icons/favicon.ico' %}"/>
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'js/vendor_login/bootstrap/css/bootstrap.min.css' %}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'fonts/fonts_login/font-awesome-4.7.0/css/font-awesome.min.css' %}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'fonts/fonts_login/Linearicons-Free-v1.0.0/icon-font.min.css' %}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'js/vendor_login/animate/animate.css' %}">
<!--===============================================================================================-->	
	<link rel="stylesheet" type="text/css" href="{% static 'js/vendor_login/css-hamburgers/hamburgers.min.css' %}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'js/vendor_login/animsition/css/animsition.min.css' %}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'js/vendor_login/select2/select2.min.css' %}">
<!--===============================================================================================-->	
	<link rel="stylesheet" type="text/css" href="{% static 'js/vendor_login/daterangepicker/daterangepicker.css' %}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'css/css_login/util.css' %}">
	<link rel="stylesheet" type="text/css" href="{% static 'css/css_login/main.css' %}">
<!--===============================================================================================-->
</head>
<body>
	
	<div class="limiter">
		<div class="container-login100" style="background: rgb(0, 255, 200);">
			<div class="wrap-login100 p-t-30 p-b-50">
				<span>{% include 'message.html' %}</span>
				<span class="login100-form-title p-b-41">
					Account Login
				</span>
                
				<form  class="login100-form validate-form p-b-33 p-t-5" method="post" action="{% url 'accounts:login' %}">
                    {% csrf_token %}
					<div class="wrap-input100 validate-input" data-validate = "Enter username">
						<input class="input100" type="text" name="{{form.username.name}}" placeholder="Username / Email" value="{{form.username.value|default:''}}">
						<span class="focus-input100" data-placeholder="&#xe82a;"></span>
					</div>

					<div class="wrap-input100 validate-input" data-validate="Enter password">
						<input class="input100" type="password" name="{{form.password.name}}" placeholder="Password" value="{{form.password.value|default:''}}">
						<span class="focus-input100" data-placeholder="&#xe80f;"></span>
					</div>

					<div class="container-login100-form-btn m-t-32">
						<button class="login100-form-btn">
							Login
						</button>
						<a class="forget_form" href="{% url 'accounts:password_reset' %}">
							Forgot Password
						</a>
					</div>

				</form>
			</div>
		</div>
	</div>
	

	<div id="dropDownSelect1"></div>
	
<!--===============================================================================================-->
	<script src="{% static 'js/vendor_login/jquery/jquery-3.2.1.min.js' %}"></script>
<!--===============================================================================================-->
	<script src="{% static 'js/vendor_login/animsition/js/animsition.min.js' %}"></script>
<!--===============================================================================================-->
	<script src="{% static 'js/vendor_login/bootstrap/js/popper.js' %}"></script>
	<script src="{% static 'js/vendor_login/bootstrap/js/bootstrap.min.js' %}"></script>
<!--===============================================================================================-->
	<script src="{% static 'js/vendor_login/select2/select2.min.js' %}"></script>
<!--===============================================================================================-->
	<script src="{% static 'js/vendor_login/daterangepicker/moment.min.js' %}"></script>
	<script src="{% static 'js/vendor_login/daterangepicker/daterangepicker.js' %}"></script>
<!--===============================================================================================-->
	<script src="{% static 'js/vendor_login/countdowntime/countdowntime.js' %}"></script>
<!--===============================================================================================-->
	<script src="{% static 'js/js_login/main.js' %}"></script>

</body>
</html>
